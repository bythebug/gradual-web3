  .diff-filter-group { display: flex; gap: 4px; }
  .diff-filter-btn { background: var(--surface2); border: 1px solid var(--border); border-radius: 6px; padding: 6px 10px; font-size: 11px; cursor: pointer; font-family: inherit; transition: all 0.15s; font-weight: 600; }

  .diff-filter-btn.inter { color: var(--yellow); }
  .diff-filter-btn.adv { color: var(--red); }

  .diff-filter-btn.active.inter { background: var(--yellow-bg); border-color: var(--yellow); }
  .diff-filter-btn.active.adv { background: var(--red-bg); border-color: var(--red); }
  .reset-btn { background: transparent; border: 1px solid var(--border); border-radius: 6px; padding: 6px 12px; color: var(--muted); font-size: 12px; cursor: pointer; font-family: inherit; transition: all 0.15s; margin-left: auto; }

  .stat-value.blue { color: var(--accent); }
  .stat-value.yellow { color: var(--yellow); }

  .diff-badge.I { background: var(--yellow-bg); color: var(--yellow); }

  .footer { text-align: center; padding: 32px 24px; color: var(--muted); font-size: 11px; }

    .q-order { display: none; }

  }

// ── State ──────────────────────────────────────────────────────────────────────
const KEY = 'gradual-web3-v1';
let done = new Set(JSON.parse(localStorage.getItem(KEY) || '[]'));
let activeFilter = 'all';
let activeDiff = null;
let searchQ = '';

// ── Build DOM ──────────────────────────────────────────────────────────────────
function buildId(catId, cIdx, iIdx) { return `${catId}:${cIdx}:${iIdx}`; }

function renderAll() {
  const container = document.getElementById('categories');
  container.innerHTML = '';

  DATA.forEach(cat => {
    const el = document.createElement('div');
    el.className = 'category';
    el.id = 'cat-' + cat.id;

    let allItems = [];
    cat.concepts.forEach((c, ci) => c.items.forEach((item, ii) => allItems.push({ item, ci, ii })));
    const total = allItems.length;
    const doneCount = allItems.filter(({ item, ci, ii }) => done.has(buildId(cat.id, ci, ii))).length;

    el.innerHTML = `
      <div class="cat-header" onclick="toggleCat('${cat.id}')">
        <span class="cat-chevron">▶</span>
        <span class="cat-emoji">${cat.emoji}</span>
        <span class="cat-name">${cat.name}<span class="cat-subtitle">${cat.subtitle}</span></span>
        <div class="cat-meta">
          <span class="cat-done-count" id="cdone-${cat.id}">${doneCount}</span>
          <span class="cat-total-count">/ ${total}</span>
          <div class="cat-bar-wrap"><div class="cat-bar-fill" id="cbar-${cat.id}" style="width:${total?doneCount/total*100:0}%"></div></div>
        </div>
      </div>
      <div class="questions-list" id="qlist-${cat.id}"></div>`;

    const qlist = el.querySelector('.questions-list');
    let order = 1;
    cat.concepts.forEach((concept, ci) => {
      const div = document.createElement('div');
      div.className = 'concept-divider';
      div.innerHTML = `<span class="concept-label">${concept.name}</span>`;
      qlist.appendChild(div);

      concept.items.forEach((item, ii) => {
        const id = buildId(cat.id, ci, ii);
        const isDone = done.has(id);
        const diffLabel = item.diff === 'F' ? 'Foundational' : item.diff === 'I' ? 'Intermediate' : 'Advanced';
        const row = document.createElement('div');
        row.className = 'q-row' + (isDone ? ' done' : '');
        row.dataset.id = id;
        row.dataset.diff = item.diff;
        row.dataset.title = item.title.toLowerCase();
        row.innerHTML = `
          <div class="q-checkbox${isDone?' checked':''}" onclick="toggle('${id}',this)">${isDone?'✓':''}</div>
          <span class="q-order">${order}</span>
          <span class="diff-badge ${item.diff}">${diffLabel}</span>
          <span class="q-title">${item.title}</span>
          <span class="src-badge ${item.src}">${item.src}</span>
          <a class="q-link${item.btn ? ' build' : ''}" href="${item.url}" target="_blank" rel="noopener">${item.btn || 'Read →'}</a>`;
        qlist.appendChild(row);
        order++;
      });
    });

    container.appendChild(el);
  });

  applyFilters();
  updateStats();
}

function toggleCat(id) {
  const el = document.getElementById('cat-' + id);
  el.classList.toggle('open');
}

function toggle(id, checkbox) {
  if (done.has(id)) {
    done.delete(id);
    checkbox.classList.remove('checked');
    checkbox.textContent = '';
    checkbox.closest('.q-row').classList.remove('done');
  } else {
    done.add(id);
    checkbox.classList.add('checked');
    checkbox.textContent = '✓';
    checkbox.closest('.q-row').classList.add('done');
  }
  localStorage.setItem(KEY, JSON.stringify([...done]));
  updateStats();
}

function updateStats() {
  const total = document.querySelectorAll('.q-row').length;
  const doneCount = done.size;
  const rem = total - doneCount;
  const pct = total ? Math.round(doneCount / total * 100) : 0;
  document.getElementById('done-count').textContent = doneCount;
  document.getElementById('total-count').textContent = total;
  document.getElementById('stat-done').textContent = doneCount;
  document.getElementById('stat-rem').textContent = rem;
  document.getElementById('stat-total').textContent = total;
  document.getElementById('stat-pct').textContent = pct + '%';
  document.getElementById('progress-bar').style.width = pct + '%';

  DATA.forEach(cat => {
    let catDone = 0, catTotal = 0;
    cat.concepts.forEach((c, ci) => c.items.forEach((_, ii) => {
      catTotal++;
      if (done.has(buildId(cat.id, ci, ii))) catDone++;
    }));
    const doneEl = document.getElementById('cdone-' + cat.id);
    const barEl = document.getElementById('cbar-' + cat.id);
    if (doneEl) doneEl.textContent = catDone;
    if (barEl) barEl.style.width = catTotal ? (catDone / catTotal * 100) + '%' : '0%';
  });
}

function applyFilters() {
  let anyVisible = false;
  document.querySelectorAll('.q-row').forEach(row => {
    const isDone = row.classList.contains('done');
    const diff = row.dataset.diff;
    const title = row.dataset.title;
    let show = true;
    if (activeFilter === 'todo' && isDone) show = false;
    if (activeFilter === 'done' && !isDone) show = false;
    if (activeDiff && diff !== activeDiff) show = false;
    if (searchQ && !title.includes(searchQ)) show = false;
    row.classList.toggle('hidden', !show);
    if (show) anyVisible = true;
  });

  document.querySelectorAll('.category').forEach(cat => {
    const rows = cat.querySelectorAll('.q-row:not(.hidden)');
    cat.style.display = rows.length === 0 ? 'none' : '';
  });

  document.getElementById('empty-state').classList.toggle('show', !anyVisible);
}

// ── Filters ────────────────────────────────────────────────────────────────────
document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    activeFilter = btn.dataset.filter;
    applyFilters();
  });
});

document.querySelectorAll('.diff-filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    const d = btn.dataset.diff;
    if (activeDiff === d) {
      activeDiff = null;
      btn.classList.remove('active');
    } else {
      document.querySelectorAll('.diff-filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      activeDiff = d;
    }
    applyFilters();
  });
});

document.getElementById('search').addEventListener('input', e => {
  searchQ = e.target.value.toLowerCase().trim();
  applyFilters();
  if (searchQ) document.querySelectorAll('.category').forEach(c => { if (c.style.display !== 'none') c.classList.add('open'); });
});

document.getElementById('reset-btn').addEventListener('click', () => {
  if (!confirm('Reset all progress?')) return;
  done.clear();
  localStorage.removeItem(KEY);
  document.querySelectorAll('.q-row').forEach(row => {
    row.classList.remove('done');
    const cb = row.querySelector('.q-checkbox');
    cb.classList.remove('checked');
    cb.textContent = '';
  });
  updateStats();
});

// ── Theme ──────────────────────────────────────────────────────────────────────
const themeBtn = document.getElementById('theme-btn');
const html = document.documentElement;
const savedTheme = localStorage.getItem('gradual-web3-theme') || 'dark';
html.setAttribute('data-theme', savedTheme);
themeBtn.textContent = savedTheme === 'dark' ? '🌙' : '☀️';
themeBtn.addEventListener('click', () => {
  const next = html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  html.setAttribute('data-theme', next);
  themeBtn.textContent = next === 'dark' ? '🌙' : '☀️';
  localStorage.setItem('gradual-web3-theme', next);
});

// ── Init ───────────────────────────────────────────────────────────────────────
renderAll();
document.querySelector('.category').classList.add('open');
</script>
